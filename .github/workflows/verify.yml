name: verify brand exports

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Fails if tokens.json and riposte-brand.css disagree on a hex value, if a
      # -deep accent stops clearing WCAG AA 4.5:1, if a non-zero border-radius
      # appears, if a shadow gains a blur radius, or if riposte.ase stops
      # round-tripping.
      - name: verify consistency
        run: node scripts/build.js --check

      - name: verify doc links
        run: node scripts/check-links.js

      # Regenerating must be a no-op. If it isn't, someone edited a generated
      # file by hand instead of editing brand/tokens.json.
      - name: exports are up to date
        run: |
          node scripts/build.js
          if ! git diff --exit-code; then
            echo "::error::Generated exports are stale. Run 'node scripts/build.js' and commit the result."
            exit 1
          fi
